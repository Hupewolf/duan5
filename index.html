<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deadline5</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div  class="maunen">
        <table class="banghieu">
            <th rowspan="2" class="banghieu1"><i class="fa-solid fa-bolt"></i>Jackson<br><div class="duongke">Electronics</div></th>
        </table>
        <table  class="banghieu">
            <th style="font-size: 20px;">Registration Form</th>
        </table>
        <table class="banghieu2">
            <tr>
                <td colspan="2" align="center">Register your Jackson Electronics Product here</td>
            </tr>
            <tr>
                <td>First Name: </td>
                <td>
                    <input type="text" size="8" style="margin-left: 21%;"> Last Name: <input type="text" size="8">
                </td>
            </tr> 
            <tr>
                <td>Address#1: </td>
                <td><input type="text" size="21" style="margin-left: 21%;"></td>
            </tr>
            <tr>
                <td>Address#2: </td>
                <td><input type="text" size="21" style="margin-left: 21%;"></td>
            </tr>      
            <tr>
                <td>City: </td>
                <td><input type="text" size="11" style="margin-left: 21%;">State: <input type="text" size="1">Zip: <input type="text" size="3"></td>
            </tr>
            <tr>
                <td>Country: </td>
                <td><input type="text" value="United States" size="12" style="margin-left: 21%;"></td>
            </tr>
        </table>    
        <table class="banghieu2"><hr style="width: 480px;"></table>    
        <table class="bangcuu">
            <tr>
                <td>Product: </td>
                <td>
                    <select>
                        <option>ScanMaster</option>
                        <option>Siêu nhân</option>
                        <option>Kamen rider</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Date Purchased: </td>
                <td><input type="text" size="11"></td>
            </tr>
            <tr>
                <td>Serial #: </td>
                <td><input type="text" size="11"></td>
            </tr>
            <tr>
                <td>User for: </td>
                <td>
                    <label>
                        <input type="radio" name="chon">Home  
                    </label>
                    <label>                 
                        <input type="radio" name="chon" style="margin-left: 85px;">Educational Institution
                    </label>    
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label>
                        <input type="radio" name="chon">Business
                    </label>
                    <label>    
                        <input type="radio" name="chon" style="margin-left: 68px;">Other
                    </label>    
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label>
                        <input type="radio" name="chon">Government
                    </label>    
                </td>
            </tr>
            <tr>
                <td>System(check all that apply):</td>
                <td>
                    <input type="checkbox" name="chon1">Windows
                    <input type="checkbox" name="chon1" style="margin-left: 64px;">UNIX
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="checkbox" name="chon1">Macintosh
                    <input type="checkbox" name="chon1" style="margin-left: 58px;">Other
                </td>
            </tr>
        </table>
        <table class="banghieu2"><hr style="width: 480px;"></table>
        <table class="banghieu2">    
            <tr>
                <td>Comments?: </td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td><textarea cols="39" rows="5" style="margin-left: 21%;"></textarea></td>
                
            </tr>
            <tr>
                <th colspan="2">
                    <input type="button" value="Click to register" class="nut">
                    <input type="button" value="Click to cancel" class="nut1">
                </th>
            </tr>
        </table>
    </div>    
</body>
</html>
